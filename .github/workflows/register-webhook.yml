
name: Register Telegram Webhook

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register webhook
        env:
          SETUP_KEY: ${{ secrets.WEBHOOK_SETUP_KEY }}
        run: |
          curl --fail-with-body -X POST \
            https://music-bot-dusky.vercel.app/setup-webhook \
            -H "X-Setup-Key: $SETUP_KEY"
